name: Auto Update SSQ & Export Candidate Pool

on:
  schedule:
    # 北京时间 (UTC+8) 每周一、三、五 08:05 执行 -> UTC 时间 00:05
    - cron: '5 0 * * 1,3,5'
  workflow_dispatch: # 支持在 GitHub 网页界面手动点击立即触发

permissions:
  contents: write

jobs:
  update-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Update SSQ Draw History
        run: |
          python main.py update

      - name: 2. Check and Settle Past Predictions
        run: |
          python main.py check

      - name: 3. Train Model & Export Top-20 Candidate Pool
        run: |
          python main.py export-pool

      - name: 4. Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ssq.db data/ssq_history.csv docs/data/pool.json reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update SSQ draws & freeze top-20 pool [skip ci]" && git push)
