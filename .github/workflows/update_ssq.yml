name: Auto Update SSQ & Export Candidate Pool

on:
  schedule:
    # 北京时间 (UTC+8) 每周二、四、日 21:25 (开奖 21:15 后 10 分钟) 执行 -> UTC 时间 13:25
    - cron: '25 13 * * 0,2,4'
  workflow_dispatch: # 支持在 GitHub 网页界面手动点击立即触发

permissions:
  contents: write

jobs:
  update-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Update SSQ Draw History
        run: |
          python main.py update --wait 15

      - name: 2. Check and Settle Past Predictions
        run: |
          python main.py check

      - name: 3. Train Model & Export Top-20 Candidate Pool
        run: |
          python main.py export-pool

      - name: 4. Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ssq_history.csv docs/data/pool.json reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update SSQ draws & freeze top-20 pool [skip ci]" && git push)
